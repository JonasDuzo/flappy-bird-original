<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird</title>
    <style>
        /* --s = tamanho de tela (px) de cada unidade lógica do jogo.
           O script.js atualiza esse valor a cada redimensionamento, então
           textos, botões e bordas acompanham o tamanho do canvas. */
        :root {
            --s: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: grid;
            place-items: center;
            background: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Proporção 2:3. O JS ajusta largura/altura para pixels físicos inteiros;
           isto é só o valor inicial antes do script rodar. */
        #gameContainer {
            position: relative;
            height: min(100vh, 150vw);
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: #70c5ce;
            contain: layout paint style;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            z-index: 10;
        }

        .overlay h1 {
            font-size: calc(48px * var(--s));
            margin-bottom: calc(20px * var(--s));
            text-shadow: calc(3px * var(--s)) calc(3px * var(--s)) 0 #000;
        }

        .overlay p {
            font-size: calc(20px * var(--s));
            margin-bottom: calc(30px * var(--s));
            padding: 0 calc(20px * var(--s));
            text-align: center;
        }

        .overlay p.hint {
            font-size: calc(14px * var(--s));
            opacity: 0.8;
            margin-top: calc(-14px * var(--s));
        }

        button {
            padding: calc(15px * var(--s)) calc(40px * var(--s));
            font-family: inherit;
            font-size: calc(24px * var(--s));
            background: #ffa500;
            color: white;
            border: calc(3px * var(--s)) solid #000;
            border-radius: calc(10px * var(--s));
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 calc(5px * var(--s)) 0 #cc8400;
            transition: transform 0.1s;
        }

        button:hover:not(:disabled) {
            background: #ffb733;
        }

        button:active:not(:disabled) {
            transform: translateY(calc(3px * var(--s)));
            box-shadow: 0 calc(2px * var(--s)) 0 #cc8400;
        }

        button:focus-visible {
            outline: calc(3px * var(--s)) solid #fff;
            outline-offset: calc(3px * var(--s));
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #score {
            position: absolute;
            top: calc(30px * var(--s));
            left: 50%;
            transform: translateX(-50%);
            font-size: calc(48px * var(--s));
            font-weight: bold;
            color: white;
            text-shadow: calc(3px * var(--s)) calc(3px * var(--s)) 0 #000;
            z-index: 5;
            pointer-events: none;
        }

        #finalScore {
            font-size: calc(36px * var(--s));
            margin: calc(20px * var(--s)) 0;
            color: #ffa500;
        }

        /* Aviso de nível / novo cenário */
        #toast {
            position: absolute;
            top: calc(105px * var(--s));
            left: 0;
            right: 0;
            text-align: center;
            font-size: calc(26px * var(--s));
            font-weight: bold;
            color: #ffa500;
            text-shadow: calc(2px * var(--s)) calc(2px * var(--s)) 0 #000;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
        }

        #toast.show {
            animation: toast 1.8s ease-out;
        }

        @keyframes toast {
            0% { opacity: 0; transform: translateY(calc(-10px * var(--s))) scale(0.9); }
            12% { opacity: 1; transform: translateY(0) scale(1.05); }
            20% { transform: scale(1); }
            75% { opacity: 1; }
            100% { opacity: 0; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="score" class="hidden">0</div>
        <div id="toast"></div>

        <div id="startScreen" class="overlay">
            <h1>Flappy Bird</h1>
            <p>Clique, toque ou pressione ESPAÇO para voar</p>
            <p class="hint">P ou ESC pausam o jogo</p>
            <button id="startBtn" type="button" disabled>COMEÇAR</button>
        </div>

        <div id="pauseScreen" class="overlay hidden">
            <h1>Pausado</h1>
            <p>Clique ou pressione ESPAÇO para continuar</p>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1>Game Over!</h1>
            <div id="finalScore">Pontuação: 0</div>
            <button id="restartBtn" type="button">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
